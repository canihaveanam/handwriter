<!DOCTYPE html>
<html>

<head>

<title>手写大病历</title>

<meta charset="utf-8">

<style>

body{
    font-family:Arial,sans-serif;
    margin:0;
    padding:20px;
    background:#f5f5f5;
}

.container{
    display:flex;
    gap:20px;
    max-width:1400px;
    margin:auto;
}

.panel{
    background:white;
    padding:20px;
    border-radius:8px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.control-panel{
    flex:1;
}

.preview-panel{
    flex:2;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
    color:#333;
}

input,
textarea{

    width:100%;
    padding:8px;
    border:1px solid #ddd;
    border-radius:4px;
    box-sizing:border-box;

}
textarea{

    height:120px;
    resize:vertical;

}
input[type=number]{
    width:100%;
}
button{

    background:#007cba;
    color:white;
    padding:10px 20px;
    border:none;
    border-radius:4px;
    cursor:pointer;
    margin:5px;

}

button:hover{

    background:#005a87;

}

.preview-frame{

    width:100%;
    height:600px;
    border:1px solid #ddd;
    border-radius:4px;

}

.tab-buttons{

    display:flex;
    border-bottom:1px solid #ddd;
    margin-bottom:10px;

}

.tab-button{

    padding:10px 20px;
    cursor:pointer;
    border:none;
    background:#eee;
    border-radius:4px 4px 0 0;

}

.tab-button.active{

    background:#007cba;
    color:white;

}

.tab-content{

    display:none;

}

.tab-content.active{

    display:block;

}

</style>

</head>

<body>

<div class="container">

<!-- 左侧控制区域 -->

<div class="panel control-panel">

<h2>手写大病历！</h2>

<div class="tab-buttons">

<button class="tab-button active"
onclick="switchTab('basic',this)">
基本信息
</button>

<button class="tab-button"
onclick="switchTab('text',this)">
文本设置
</button>

<button class="tab-button"
onclick="switchTab('effects',this)">
手写效果
</button>

<button class="tab-button"
onclick="switchTab('fields',this)">
字段位置
</button>

</div>

<!-- 基本信息 -->

<div id="basic"
class="tab-content active">

<div class="form-group">

<label>病区</label>
<input id="病区">

<label>姓名</label>
<input id="姓名">

<label>床号</label>
<input id="床号">

<label>住院号</label>
<input id="住院号">

</div>

<div class="form-group">

<label>文本内容</label>

<textarea id="text_content"
placeholder="请输入文本内容"></textarea>

</div>

</div>

<!-- 滑块自动生成 -->

<div id="text"
class="tab-content">

</div>

<div id="effects"
class="tab-content">

</div>

<!-- 字段位置自动生成 -->

<div id="fields"
class="tab-content">

</div>

<button onclick="generatePreview()">
预览PDF
</button>

<button id="downloadAllImages"
onclick="downloadAllImages()"
disabled>

下载所有页面图片(ZIP)

</button>

</div>

<!-- 右侧预览 -->

<div class="panel preview-panel">
<h2>实时预览</h2>

<iframe
class="preview-frame"
id="previewFrame">

</iframe>

</div>

</div>
<script>

// ===============================
// 滑块配置
// ===============================

const settingsConfig = [

    ["font_size","字体大小",8,30,15],

    ["start_x","起始X坐标",0,500,64],

    ["start_y","起始Y坐标",0,800,661],

    ["line_height","行间距",10,50,30],

    ["line_jitter","行抖动",0,5,3],

    ["char_jitter","字抖动",0,5,2]

];

// ===============================
// 字段配置
// ===============================

const fieldConfig = [

    ["病区",110,694],

    ["姓名",190,694],

    ["床号",280,694],

    ["住院号",450,694]

];

// ===============================
// 动态生成滑块
// ===============================

function createsettingsConfig(){

    const textBox =
        document.getElementById("text");

    const effectBox =
        document.getElementById("effects");

    settingsConfig.forEach(item=>{

        const html = `

        <div class="form-group">

        <label>${item[1]}</label>

        <div class="slider-container">

        <input
        type="number"
        id="${item[0]}"
        min="${item[2]}"
        max="${item[3]}"
        value="${item[4]}"
        >


        </div>

        </div>

        `;

        if(
            item[0]=="line_jitter"
            ||
            item[0]=="char_jitter"
        ){

            effectBox.innerHTML += html;

        }
        else{

            textBox.innerHTML += html;

        }

    });

}

// ===============================
// 动态生成字段位置
// ===============================

function createFields(){
    const box =
    document.getElementById("fields");

    fieldConfig.forEach(item=>{
        box.innerHTML += `
        <div class="form-group">
        <label>${item[0]}位置</label>
        X:
        <input
        type="number"
        id="${item[0]}_x"
        value="${item[1]}"
        >
        Y:
        <input
        type="number"
        id="${item[0]}_y"
        value="${item[2]}"
        >
        </div>
        `;
    });
}

// ===============================
// Tab切换
// ===============================

function switchTab(id,btn){

    document
    .querySelectorAll(".tab-content")
    .forEach(
        x=>x.classList.remove("active")
    );
    document
    .querySelectorAll(".tab-button")
    .forEach(
        x=>x.classList.remove("active")
    );
    document
    .getElementById(id)
    .classList.add("active");


    btn.classList.add("active");
}

// ===============================
// 获取设置参数
// ===============================

function getSettings(){
    let result={};

    settingsConfig.forEach(item=>{

        result[item[0]]
        =
        Number(
            document
            .getElementById(item[0])
            .value
        );

    });

    result.fields={};
    fieldConfig.forEach(item=>{


        result.fields[item[0]]
        = {

            x:Number(
                document
                .getElementById(
                    item[0]+"_x"
                )
                .value
            ),


            y:Number(
                document
                .getElementById(
                    item[0]+"_y"
                )
                .value
            )

        };


    });


    return result;

}

// ===============================
// 获取患者信息
// ===============================

function getFields(){

    let data={};

    fieldConfig.forEach(item=>{


        data[item[0]]
        =
        document
        .getElementById(item[0])
        .value;


    });


    return data;


}

let currentPdfFilename=null;

// ===============================
// PDF预览
// ===============================

async function generatePreview(){



    const text =
    document.getElementById(
        "text_content"
    ).value;



    if(!text){

        alert(
            "请输入文本内容"
        );

        return;

    }



    const res =
    await fetch(
        "/preview",
        {

        method:"POST",

        headers:{
            "Content-Type":
            "application/json"
        },


        body:JSON.stringify({

            text:text,

            fields:getFields(),

            settings:getSettings()

        })


    });

    const data =
    await res.json();



    if(data.success){


        currentPdfFilename =
        data.preview_url
        .split("/")
        .pop();



        document
        .getElementById(
            "previewFrame"
        )
        .src =
        data.preview_url
        +
        "?t="
        +
        Date.now();



        document
        .getElementById(
            "downloadAllImages"
        )
        .disabled=false;


    }



}

// ===============================
// 下载JPG ZIP
// ===============================

function downloadAllImages(){

    if(!currentPdfFilename){

        alert(
            "请先生成PDF"
        );
        return;
    }

    window.location.href =
    `/download_images/${currentPdfFilename}`;

}


// ===============================
// 自动保存
// ===============================

const STORAGE_KEY =
"medical_form_data";

function autoSave(){


    let data={};



    document
    .querySelectorAll(
        "input,textarea"
    )
    .forEach(el=>{


        if(el.id)

        data[el.id]=el.value;


    });



    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(data)

    );


}




// ===============================
// 恢复数据
// ===============================

function restoreData(){


    const saved =
    localStorage.getItem(
        STORAGE_KEY
    );



    if(!saved)

        return;



    const data =
    JSON.parse(saved);



    Object.keys(data)
    .forEach(id=>{


        const el =
        document
        .getElementById(id);



        if(el){


            el.value=data[id];





        }


    });



}



// ===============================
// 初始化
// ===============================

createsettingsConfig();

createFields();


window.addEventListener(
    "DOMContentLoaded",
    restoreData
);


document.addEventListener(
    "input",
    autoSave
);



</script>

</body>
</html>
