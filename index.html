<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>手写大病历</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>

<body>

<div class="container">

    <div class="panel control-panel">

        <h2>手写大病历</h2>

        <div class="tab-buttons">

            <button
                class="tab-button active"
                onclick="switchTab('basic',this)"
            >
                基本信息
            </button>

            <button
                class="tab-button"
                onclick="switchTab('text',this)"
            >
                文本设置
            </button>

            <button
                class="tab-button"
                onclick="switchTab('effects',this)"
            >
                手写效果
            </button>

        </div>

        <div
            id="basic"
            class="tab-content active"
        >

            <div class="form-group patient-info">

                <label>病区</label>
                <input id="病区">

                <label>姓名</label>
                <input id="姓名">

                <label>床号</label>
                <input id="床号">

                <label>住院号</label>
                <input id="住院号">

            </div>

            <div class="background-manager">
                <label for="backgroundFile">上传纸张jpg,.jpeg,.png</label>
                <div class="background-upload-row">
                    <input
                        id="backgroundFile"
                        type="file"
                        accept="image/jpeg,image/png,.jpg,.jpeg,.png"
                        onchange="uploadCustomBackground(this.files[0])"
                    >
                </div>

                <div
                    id="backgroundStatus"
                    class="background-status"
                >
                    未上传时自动使用默认背景
                </div>
            </div>

            <div class="form-group">

                <div class="text-editor-toolbar">

                    <label>文本内容</label>

                    <button
                        type="button"
                        class="mark-button"
                        onmousedown="event.preventDefault()"
                        onclick="markSelectedText()"
                    >
                        标记
                    </button>

                </div>

                <div
                    id="text_content"
                    contenteditable="true"
                    spellcheck="false"
                    data-placeholder="请输入文本内容"
                ></div>

            </div>

        </div>

        <div
            id="text"
            class="tab-content"
        >

            <div class="form-group">

                <label>字体</label>

                <select id="font">
                    <option value="">
                        下拉选择手写风格
                    </option>
                </select>

            </div>

        </div>

        <div
            id="effects"
            class="tab-content"
        >

            <div id="effectsSettings"></div>

            <div class="template-manager">

                <div class="template-manager-title">
                    模板管理
                </div>

                <label for="templateSelect">
                    模板
                </label>

                <select
                    id="templateSelect"
                    onchange="loadSelectedTemplate()"
                >
                    <option value="">
                        请选择模板
                    </option>
                </select>

                <button
                    type="button"
                    onclick="newTemplate()"
                >
                    新建
                </button>

                <button
                    type="button"
                    onclick="saveTemplate()"
                >
                    保存模板
                </button>

                <button
                    type="button"
                    onclick="saveTemplateAs()"
                >
                    另存为
                </button>

                <button
                    type="button"
                    onclick="setDefaultTemplate()"
                >
                    设为默认
                </button>

                <button
                    type="button"
                    class="danger-button"
                    onclick="deleteTemplate()"
                >
                    删除模板
                </button>

                <div
                    id="templateStatus"
                    class="template-status"
                ></div>

            </div>

        </div>

        <div class="action-bar">

            <button
                id="layoutEditBtn"
                onclick="toggleLayoutEdit()"
            >
                编辑布局
            </button>

            <button
                id="previewBtn"
                onclick="generatePreview()"
            >
                预览生成效果
            </button>

            <button
                id="downloadAllImages"
                onclick="downloadAllImages()"
                disabled
            >
                下载所有页面图片(ZIP)
            </button>

        </div>

    </div>


    <div class="panel preview-panel">

        <h2>实时预览</h2>

        <div class="canvas-viewport">

            <!-- 编辑器：默认 base.jpg，也可切换为用户上传背景 -->
            <div
                id="previewFrame"
                class="canvas-stage"
            >

                <img
                    id="canvasImage"
                    src="/base.jpg"
                    draggable="false"
                    alt="画布"
                >

                <div
                    class="layout-box field-layout-box"
                    id="box_病区"
                    data-box="病区"
                >
                    <div class="box-text"></div>
                    <div class="resize-handle"></div>
                </div>

                <div
                    class="layout-box field-layout-box"
                    id="box_姓名"
                    data-box="姓名"
                >
                    <div class="box-text"></div>
                    <div class="resize-handle"></div>
                </div>

                <div
                    class="layout-box field-layout-box"
                    id="box_床号"
                    data-box="床号"
                >
                    <div class="box-text"></div>
                    <div class="resize-handle"></div>
                </div>

                <div
                    class="layout-box field-layout-box"
                    id="box_住院号"
                    data-box="住院号"
                >
                    <div class="box-text"></div>
                    <div class="resize-handle"></div>
                </div>

                <div
                    class="layout-box body-layout-box"
                    id="box_正文"
                    data-box="正文"
                >
                    <div class="box-text"></div>
                    <div class="resize-handle"></div>
                </div>

            </div>

            <!-- Pillow生成后，在这里连续显示第1/2/3...页 -->
            <div
                id="renderedPages"
                class="rendered-pages"
            >
            </div>

        </div>

        <div class="editor-hint">
            192.168.7.176:5000
            省医内网网址（内网网址会有变化，如果内网网址打不开来这看）
        </div>

    </div>

</div>

    
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
